name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or SHA to build (defaults to the dispatched ref)'
        required: false
      tag_name:
        description: 'Release tag name (e.g. v0.1.10)'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # `gh workflow run --ref <branch>` selects the ref this workflow file comes from; build that
      # same branch unless the caller named one explicitly. Defaulting to 'main' silently built
      # main for a branch dispatch and shipped a binary without the branch's changes.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref_name }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Install ALSA system dependency
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libasound2-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build web frontend
        working-directory: web
        run: |
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          npm run typecheck
          npm run build

      - name: Build release binary
        run: cargo build --release --bin luna

      - name: Install luna binary
        run: sudo install -m 0755 target/release/luna /usr/local/bin/luna

      - name: Verify installed binary
        run: luna --version

      - name: Upload luna binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: luna-binary
          path: target/release/luna

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref_name }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build web frontend
        working-directory: web
        shell: bash
        run: |
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          npm run typecheck
          npm run build

      - name: Build release binary
        run: cargo build --release --bin luna

      - name: Verify built binary
        run: .\target\release\luna.exe --version

      - name: Upload luna Windows binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: luna-windows-x86_64
          path: target/release/luna.exe

  publish-release:
    needs: [build, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: luna-binary
          path: dist-linux
      - name: Download Windows binary
        uses: actions/download-artifact@v4
        with:
          name: luna-windows-x86_64
          path: dist-windows
      - name: Package release assets
        run: |
          mkdir -p release-assets
          chmod +x dist-linux/luna
          cp dist-linux/luna release-assets/luna-linux-x86_64
          tar -czf release-assets/luna-linux-x86_64.tar.gz -C dist-linux luna
          cp dist-windows/luna.exe release-assets/luna-windows-x86_64.exe
          zip -j release-assets/luna-windows-x86_64.zip dist-windows/luna.exe
      - name: Create or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          if [[ "$TAG" != v* ]]; then
            TAG="v0.1.11"
          fi
          gh release create "$TAG" release-assets/* \
            --title "$TAG" \
            --notes "Luna $TAG release with update notifications & self-update support (/update command & Web UI notice), and skill pinning." || \
          gh release upload "$TAG" release-assets/* --clobber
