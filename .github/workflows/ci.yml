name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or SHA to test (defaults to the dispatched ref)'
        required: false

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts are the usual cause of a `ld` bus error on a shared runner
  # disk, and the release profile is what ships.
  CARGO_INCREMENTAL: "0"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install ALSA system dependency
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libasound2-dev

      - name: Setup Node.js and build web frontend
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build web frontend
        working-directory: web
        run: |
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          npm run typecheck
          npm run build

      # `web/dist` is generated by the step above and embedded by rust-embed. Tracking it puts a
      # rebuilt bundle in every UI commit and makes clones carry stale builds; fail loudly if it
      # ever comes back.
      - name: No build artifacts tracked
        run: |
          if [ -n "$(git ls-files web/dist)" ]; then
            echo "web/dist is generated; remove it from git (git rm -r --cached web/dist)." >&2
            git ls-files web/dist >&2
            exit 1
          fi

      # Formatting is its own step so a whitespace failure reads as one line instead of
      # scrolling past in the middle of a compile log.
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      # `--all-targets` is what makes this gate catch test and bench modules too: a
      # warning that only exists under `#[cfg(test)]` still fails the build.
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: cargo build release
        run: cargo build --release --bin luna

  # Windows is a supported target, so it is built and tested on a Windows runner: none of
  # `#[cfg(windows)]` code (raw-mode crossterm, tasklist/taskkill, rename-aside self update) is
  # compiled — let alone run — by the Linux job.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows

      # rust-embed compiles `web/dist` into the binary; without it the build fails on a fresh clone.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build web frontend
        working-directory: web
        shell: bash
        run: |
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          npm run typecheck
          npm run build

      # The AT-SPI adapter crate is Linux-only by construction (`#![cfg(target_os = "linux")]`),
      # so its examples and integration tests cannot compile here; everything else must.
      #
      # Clippy runs without `-D warnings` on this runner: the lint bar is set by the Linux job,
      # which compiles the whole `#[cfg(unix)]` test surface. Here a platform-conditional import
      # is flagged dead on Windows for no defect; a real error still fails the job.
      - name: cargo clippy
        run: cargo clippy --workspace --exclude harness-desktop-linux --all-targets

      - name: cargo test
        run: cargo test --workspace --exclude harness-desktop-linux

      - name: cargo build release
        run: cargo build --release --bin luna
