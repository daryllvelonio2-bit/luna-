name: Release Build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or SHA to build (defaults to the dispatched ref)'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # `gh workflow run --ref <branch>` selects the ref this workflow file comes from; build that
      # same branch unless the caller named one explicitly. Defaulting to 'main' silently built
      # main for a branch dispatch and shipped a binary without the branch's changes.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref_name }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Install ALSA system dependency
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libasound2-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build web frontend
        working-directory: web
        run: |
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          npm run typecheck
          npm run build

      - name: Build release binary
        run: cargo build --release --bin luna

      - name: Install luna binary
        run: sudo install -m 0755 target/release/luna /usr/local/bin/luna

      - name: Verify installed binary
        run: luna --version

      - name: Upload luna binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: luna-binary
          path: target/release/luna

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref_name }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build web frontend
        working-directory: web
        shell: bash
        run: |
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          npm run typecheck
          npm run build

      - name: Build release binary
        run: cargo build --release --bin luna

      - name: Verify built binary
        run: .\target\release\luna.exe --version

      - name: Upload luna Windows binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: luna-windows-x86_64
          path: target/release/luna.exe
