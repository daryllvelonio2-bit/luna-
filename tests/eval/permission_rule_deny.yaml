# A standing permission rule refuses a call the reviewer would have allowed. A rule is evaluated
# before the registry is reached, so no tool call is observed at all: what this case asserts is that
# the write never happened and the model was told so.
case: permission-rule-deny
prompt: Write the text must-not-land into the file blocked.txt.
tools:
  - eval_write_file
permissions:
  - action: deny
    tool: eval_write_file
    arguments: { path: "blocked*" }
    reason: writes to blocked* are forbidden by policy
script:
  - tool_calls:
      - name: eval_write_file
        arguments: { path: "blocked.txt", content: "must-not-land" }
  - answer: I could not write blocked.txt, policy refused it.
expect:
  tool_calls: []
  final_answer_contains:
    - "could not write"
  files:
    - path: blocked.txt
      exists: false
