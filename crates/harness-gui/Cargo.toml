[workspace]

[package]
name = "harness-gui"
version = "0.1.8"
edition = "2021"
authors = ["Luna Harness Team"]
license = "MIT OR Apache-2.0"
description = "Optional native Tauri desktop application embedding the Luna Harness core"

[[bin]]
name = "luna-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
harness-core = { path = "../harness-core" }
harness-app = { path = "../harness-app" }
harness-providers = { path = "../harness-providers" }
harness-memory = { path = "../harness-memory" }
harness-notes = { path = "../harness-notes" }
harness-plugins = { path = "../harness-plugins" }
harness-scheduler = { path = "../harness-scheduler" }
tokio = { version = "1.38", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt", "io", "io-util"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.8", features = ["v4"] }
