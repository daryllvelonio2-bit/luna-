[package]
name = "harness-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "luna"
path = "src/main.rs"

[dependencies]
arboard = { version = "3.4", features = ["wayland-data-control"] }
base64 = "0.22"
image = { workspace = true }
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = { workspace = true }
hmac = "0.12"
sha2 = { workspace = true }
harness-core = { workspace = true }
harness-providers = { workspace = true }
harness-memory = { workspace = true }
harness-notes = { workspace = true }
harness-note-graph = { workspace = true }
harness-plugins = { workspace = true }
harness-mcp = { workspace = true }
harness-voice = { workspace = true }
harness-telemetry = { workspace = true }
harness-onboarding = { workspace = true }
harness-desktop = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
clap = { workspace = true }
colored = { workspace = true }
dialoguer = { workspace = true }
indicatif = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
futures-util = { workspace = true }
libc = { workspace = true }
crossterm = { workspace = true }
ratatui = { workspace = true }
pulldown-cmark = { workspace = true }
unicode-width = { workspace = true }
rusqlite = { workspace = true }
similar = { workspace = true }
reqwest = { workspace = true }
url = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
harness-desktop-linux = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
